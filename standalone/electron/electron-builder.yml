appId: com.taiko.web.desktop.fork
productName: Taiko Web Desktop (Fork)
asar: true

files:
  - main.js
  - preload.js
  - package.json
  - build/icons/**
extraResources:
  - from: ../dist/backend
    to: dist/backend
    filter:
      - "**/*"

win:
  target: [nsis]
  icon: build/icons/icon.ico
  artifactName: "TaikoWebDesktop-${version}-win.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Taiko Web Desktop (Fork)"
  perMachine: false

mac:
  target: [dmg]
  category: public.app-category.games
  icon: build/icons/icon.icns
  artifactName: "Taiko Web Desktop (Fork)-${version}.${ext}"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

dmg:
  background: null
  icon: build/icons/icon.icns

linux:
  target: [AppImage]
  category: Game
  icon: build/icons
  artifactName: "TaikoWebDesktop-${version}-linux.${ext}"

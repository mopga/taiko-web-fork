appId: com.taiko.web.desktop
productName: Taiko Web Desktop
asar: true

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - package.json
  - build/icons/**
  - "!dist/**"

extraFiles:
  - from: ../dist/backend
    to: backend
    filter:
      - "**/*"
  - from: ../../assets/launcher
    to: assets/launcher
    filter:
      - "*.ico"

win:
  target:
    - target: dir
      arch:
        - x64
  icon: ../assets/launcher/app.ico
  artifactName: "TaikoWebDesktop-${version}-win-unpacked"

mac:
  target: [dmg]
  category: public.app-category.games
  icon: build/icons/icon.icns
  artifactName: "Taiko Web Desktop-${version}.${ext}"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

dmg:
  background: null
  icon: build/icons/icon.icns

linux:
  target: [AppImage]
  category: Game
  icon: build/icons
  artifactName: "TaikoWebDesktop-${version}-linux.${ext}"

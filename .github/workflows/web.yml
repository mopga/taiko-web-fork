name: Web smoke & tests

on:
  push:
  pull_request:

jobs:
  web-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run smoke_web script
        run: ./scripts/smoke_web.sh

      - name: Run pytest
        run: pytest

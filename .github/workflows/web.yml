name: Web smoke & tests

on:
  push:
  pull_request:

jobs:
  web-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Shell syntax check
        run: bash -n scripts/smoke_web.sh

      - name: Run smoke_web script
        run: ./scripts/smoke_web.sh

      - name: Run pytest
        run: pytest

      - name: Collect docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f docker-compose.yml ps --all > artifacts/docker-ps.txt || true
          docker compose -f docker-compose.yml logs > artifacts/docker-compose.log || true
          docker compose -f docker-compose.yml config > artifacts/docker-compose-config.txt || true
          docker compose -f docker-compose.yml ps -q web > artifacts/web-container-id.txt || true
          if [ -s artifacts/web-container-id.txt ]; then
            head -n 1 artifacts/web-container-id.txt | xargs docker inspect > artifacts/docker-inspect-web.json || true
          fi

      - name: Upload docker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-stack-diagnostics
          path: artifacts

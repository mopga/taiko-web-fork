name: Desktop Builds

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pyinstaller

      - name: Install Electron deps
        working-directory: standalone/electron
        run: |
          npm ci

      - name: Compute version
        id: ver
        run: |
          PKG_VERSION=$(node -p "require('./standalone/electron/package.json').version")
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            TAG=$(git describe --tags --abbrev=0)
            VERSION="$TAG"
          else
            SHA=$(git rev-parse --short HEAD)
            VERSION="${PKG_VERSION}+${SHA}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Apply desktop version
        working-directory: standalone/electron
        env:
          DESKTOP_APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          npm run set-version -- "$DESKTOP_APP_VERSION"

      - name: Build backend (PyInstaller)
        run: |
          python standalone/packaging/build_backend.py

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: standalone/electron
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win nsis zip --publish always \
            --config.extraMetadata.version="${APP_VERSION}"

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: standalone/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APP_VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --mac dmg zip --publish always \
            --config.extraMetadata.version="${APP_VERSION}"

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: taiko-no-desk-${{ steps.ver.outputs.version }}-windows
          path: |
            standalone/electron/dist/*.exe
            standalone/electron/dist/*.zip
            standalone/electron/dist/*-nsis.*
            standalone/electron/dist/*Setup*.exe
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: taiko-no-desk-${{ steps.ver.outputs.version }}-macos
          path: |
            standalone/electron/dist/*.dmg
            standalone/electron/dist/*.zip
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release payload
        run: |
          set -euo pipefail
          mkdir -p release
          find release-artifacts -type f \( -name 'taiko-no-desk-*.exe' -o -name 'taiko-no-desk-*.zip' -o -name 'taiko-no-desk-*.dmg' \) -print -exec cp {} release/ \;
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md is missing" >&2
            exit 1
          fi
          cp RELEASE_NOTES.md release/RELEASE_NOTES.md
          ls -al release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/taiko-no-desk-*.exe
            release/taiko-no-desk-*.zip
            release/taiko-no-desk-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



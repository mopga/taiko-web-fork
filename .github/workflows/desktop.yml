name: Desktop Builds

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Install Electron deps
        working-directory: standalone/electron
        run: |
          npm ci

      - name: Compute version
        id: ver
        run: |
          PKG_VERSION=$(jq -r .version standalone/electron/package.json)
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            TAG=$(git describe --tags --abbrev=0)
            VERSION="$TAG"
          else
            SHA=$(git rev-parse --short HEAD)
            VERSION="${PKG_VERSION}+${SHA}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build backend (PyInstaller)
        run: |
          python standalone/packaging/build_backend.py

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: standalone/electron
        run: |
          npm run build:win

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: standalone/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build:mac

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: taiko-web-desktop-${{ steps.ver.outputs.version }}-windows
          path: |
            standalone/electron/dist/*.exe
            standalone/electron/dist/*.zip
            standalone/electron/dist/*-nsis.*
            standalone/electron/dist/*Setup*.exe
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: taiko-web-desktop-${{ steps.ver.outputs.version }}-macos
          path: |
            standalone/electron/dist/*.dmg
            standalone/electron/dist/*.zip
          if-no-files-found: warn



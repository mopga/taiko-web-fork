name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. nightly-20251027-2130)"
        required: false
      prerelease:
        description: "Mark as prerelease?"
        type: boolean
        default: true
      draft:
        description: "Create as draft instead of published?"
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build backend (PyInstaller onedir)
        shell: pwsh
        run: python standalone/packaging/build_backend.py

      - name: Verify backend bundle
        shell: pwsh
        run: |
          $appDir = 'standalone/dist/backend/taiko-web-backend'
          if (-not (Test-Path $appDir)) { throw "Missing backend app dir: $appDir" }
          $exe = Join-Path $appDir 'taiko-web-backend.exe'
          if (-not (Test-Path $exe)) { throw "Missing backend executable: $exe" }
          $required = @('public', 'templates', 'songs')
          foreach ($name in $required) {
            $path = Join-Path $appDir $name
            if (-not (Test-Path $path)) { throw "Missing backend payload: $path" }
          }

      - name: Smoke backend (Windows)
        shell: pwsh
        env:
          SMOKE_REQUIRE_SONGS: "0"
        run: pwsh -File scripts/smoke_run_windows.ps1

      - name: Setup Node (electron)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: standalone/electron/package-lock.json

      - name: Install Electron deps
        working-directory: standalone/electron
        run: npm ci

      - name: Build Electron
        working-directory: standalone/electron
        run: npm run build

      - name: Verify Electron build
        shell: pwsh
        run: |
          $dist = 'standalone/electron/dist/win-unpacked'
          if (-not (Test-Path $dist)) { throw "Electron win-unpacked missing at $dist" }
          Get-ChildItem -Path $dist | Out-String | Write-Host

      - name: Determine installer version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF
          if ($version -and $version.StartsWith('refs/tags/')) {
            $version = $version.Substring(10)
          } else {
            $version = (Get-Date -Format 'yyyy.MM.dd-HHmmss')
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: '"C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" /DMyAppVersion="${{ steps.version.outputs.value }}" standalone\\packaging\\windows\\installer.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: backend-installer
          path: out\*.exe

      - name: Upload electron bundle
        uses: actions/upload-artifact@v4
        with:
          name: electron-win-unpacked
          path: standalone\electron\dist\win-unpacked\**
          if-no-files-found: error

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-windows
          path: _logs/**
          if-no-files-found: ignore

  build-linux:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build backend (PyInstaller onedir)
        run: python standalone/packaging/build_backend.py

      - name: Verify backend files
        run: |
          set -euo pipefail
          ls -la "standalone/dist/backend/taiko-web-backend" || true
          test -f "standalone/dist/backend/taiko-web-backend/taiko-web-backend"

      - name: Smoke backend (Linux)
        run: bash scripts/smoke_run_linux.sh

  release:
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      (github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-installer
          path: release

      - name: Prepare release payload
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Expected installer artifact" >&2
            exit 1
          fi
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md is missing" >&2
            exit 1
          fi
          cp RELEASE_NOTES.md release/RELEASE_NOTES.md
          echo "Release payload contents:"
          ls -al release

      - name: Generate tag and name
        id: gen
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.tag_name }}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
              NAME="${{ github.ref_name }}"
            else
              TAG="nightly-$(date +'%Y%m%d-%H%M')"
              NAME="nightly-$(date +'%Y%m%d')"
            fi
          else
            TAG="${{ github.event.inputs.tag_name }}"
            NAME="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "${{ github.event.inputs.draft }}" ]; then
            DRAFT="false"
          else
            DRAFT="${{ github.event.inputs.draft }}"
          fi
          if [ -z "${{ github.event.inputs.prerelease }}" ]; then
            PRERELEASE="true"
          else
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          fi
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gen.outputs.tag }}
          name: ${{ steps.gen.outputs.name }}
          draft: ${{ steps.gen.outputs.draft }}
          prerelease: ${{ steps.gen.outputs.prerelease }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.exe
            release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

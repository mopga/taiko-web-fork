name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. nightly-20251027-2130)"
        required: false
      prerelease:
        description: "Mark as prerelease?"
        type: boolean
        default: true
      draft:
        description: "Create as draft instead of published?"
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    outputs:
      installer-name: ${{ steps.installer.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate desktop prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-Module -Name powershell-yaml -Force -Scope CurrentUser
          Import-Module powershell-yaml

          $backendScript = 'standalone/packaging/build_backend.py'
          if (-not (Test-Path $backendScript)) { throw "Missing backend build script at $backendScript" }

          $builderConfig = 'standalone/electron/electron-builder.yml'
          if (-not (Test-Path $builderConfig)) { throw "Missing electron-builder configuration at $builderConfig" }

          $cfg = Get-Content $builderConfig -Raw | ConvertFrom-Yaml

          $winIcon = $cfg.win.icon
          if ([string]::IsNullOrWhiteSpace($winIcon)) { throw 'electron-builder configuration must define win.icon' }

          $iconPath = Join-Path 'standalone/electron' $winIcon
          if (-not (Test-Path $iconPath)) { throw "Missing Windows icon referenced by electron-builder: $iconPath" }

          $buildResources = $cfg.directories.buildResources
          if ($buildResources) {
            $resources = Join-Path 'standalone/electron' $buildResources
            if (-not (Test-Path $resources)) { throw "Missing buildResources directory referenced by electron-builder: $resources" }
          }

          Write-Host "win.icon = $winIcon"
          Write-Host "directories.buildResources = $buildResources"

      - name: Validate build icons
        shell: pwsh
        run: |
          $iconPath = 'standalone\electron\build\icons\icon.ico'
          if (-not (Test-Path $iconPath)) {
            throw "Missing required build icon at $iconPath"
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build backend (PyInstaller onedir)
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pyinstaller-hooks-contrib
          python standalone/packaging/build_backend.py

      - name: Verify backend files
        shell: bash
        run: |
          set -euo pipefail
          echo "== dist tree =="
          ls -laR standalone/dist || true
          LINUX_BIN="standalone/dist/backend/taiko-web-backend/taiko-web-backend"
          WIN_BIN="standalone/dist/backend/taiko-web-backend/taiko-web-backend.exe"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            if [[ ! -f "${LINUX_BIN}" ]]; then
              echo "Missing ${LINUX_BIN}" >&2
              exit 1
            fi
            chmod +x "${LINUX_BIN}"
          else
            if [[ ! -f "${WIN_BIN}" ]]; then
              echo "Missing ${WIN_BIN}" >&2
              exit 1
            fi
          fi

      - name: Show backend app_dir content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "== app dir =="
          ls -la "standalone/dist/backend/taiko-web-backend" || true

      - name: Smoke backend
        shell: pwsh
        run: |
          $backendRoot = Join-Path "standalone/dist/backend" "taiko-web-backend"
          $exe = Join-Path $backendRoot "taiko-web-backend.exe"
          if (-not (Test-Path $exe)) { throw "Backend exe not found at $exe" }
          $dataDir = Join-Path $env:RUNNER_TEMP "taiko-data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:RUN_PROFILE = "desktop"
          $env:PORT = "8000"
          $env:DATA_DIR = $dataDir
          Push-Location $backendRoot
          Start-Process -FilePath $exe -PassThru -WindowStyle Hidden | Tee-Object -Variable P | Out-Null
          for ($i=0; $i -lt 30; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/healthz | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            if ($i -eq 29) { throw "Backend did not become healthy" }
          }
          $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/healthz | Select-Object -ExpandProperty Content
          try {
            $healthJson = $health | ConvertFrom-Json -ErrorAction Stop
          } catch {
            Write-Host "---- /healthz raw body ----"
            Write-Host $health
            throw "Failed to parse /healthz JSON: $($_.Exception.Message)"
          }
          if ($healthJson.profile -ne 'desktop') { throw "Unexpected profile: $($healthJson.profile)" }
          if (-not ($healthJson.db_path -and ($healthJson.db_path -like (Join-Path $dataDir '*')))) {
            throw "db_path does not reside in DATA_DIR: $($healthJson.db_path)"
          }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/ | Out-Null
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/api/songs | Out-Null
          Stop-Process -Id $P.Id -Force
          Pop-Location

      - name: Smoke songs injection
        shell: pwsh
        run: |
          $backendRoot = Join-Path "standalone/dist/backend" "taiko-web-backend"
          $exe = Join-Path $backendRoot "taiko-web-backend.exe"
          if (-not (Test-Path $exe)) { throw "Backend exe not found at $exe" }
          $songsRoot = Join-Path $backendRoot "songs"
          New-Item -ItemType Directory -Force -Path (Join-Path $songsRoot "test-track") | Out-Null
          Copy-Item -Recurse "tools/ci-assets/test-track\*" (Join-Path $songsRoot "test-track")
          $dataDir = Join-Path $env:RUNNER_TEMP "taiko-data-inject"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:RUN_PROFILE = "desktop"
          $env:PORT = "8000"
          $env:DATA_DIR = $dataDir
          Push-Location $backendRoot
          Start-Process -FilePath $exe -PassThru -WindowStyle Hidden | Tee-Object -Variable P | Out-Null
          for ($i=0; $i -lt 30; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/healthz | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            if ($i -eq 29) { throw "Backend did not become healthy" }
          }
          $resp = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/api/songs
          try {
            $payload = $resp.Content | ConvertFrom-Json -ErrorAction Stop
          } catch {
            Write-Host "---- /api/songs raw body ----"
            Write-Host $resp.Content
            throw "Failed to parse /api/songs JSON: $($_.Exception.Message)"
          }
          if ($null -eq $payload) { throw "Songs payload is null" }
          if ($payload -is [pscustomobject] -and ($payload | Get-Member -Name items -ErrorAction SilentlyContinue)) {
            $songs = @($payload.items)
          } elseif ($payload -is [System.Collections.IEnumerable]) {
            $songs = @($payload)
          } else {
            throw "Unexpected songs payload type: $($payload.GetType().FullName)"
          }
          $songs = $songs | Where-Object { $_ -ne $null }
          if ($songs.Count -lt 1) { throw "Songs payload did not include the injected track" }
          $first = $songs[0]
          if (-not $first.is_playable) { throw "First song is not marked playable" }
          $difficulties = $first.difficulties
          if ($null -eq $difficulties) { throw "First song missing difficulties" }
          $difficultyKeys = @()
          if ($difficulties -is [pscustomobject]) {
            $difficultyKeys = ($difficulties | Get-Member -MemberType NoteProperty | Select-Object -ExpandProperty Name)
          } elseif ($difficulties -is [System.Collections.IDictionary]) {
            $difficultyKeys = $difficulties.Keys
          }
          if ($difficultyKeys.Count -eq 0) { throw "First song has no difficulties entries" }
          foreach ($name in $difficultyKeys) {
            $value = $difficulties.$name
            if ($difficulties -is [System.Collections.IDictionary]) { $value = $difficulties[$name] }
            if (-not ($value -is [pscustomobject] -or $value -is [System.Collections.IDictionary])) {
              throw "Difficulty $name is not an object"
            }
          }
          Stop-Process -Id $P.Id -Force
          Pop-Location

      - name: Setup Node (electron)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: standalone/electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: standalone/electron
        run: npm ci

      - name: Determine desktop metadata
        id: version
        shell: pwsh
        run: |
          $package = Get-Content 'standalone/electron/package.json' | ConvertFrom-Json
          if (-not $package.version) {
            throw 'Unable to read package version from standalone/electron/package.json'
          }
          if (-not $package.productName) {
            throw 'Unable to read productName from standalone/electron/package.json'
          }
          "value=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "product=$($package.productName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build desktop bundle
        working-directory: ./standalone/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
        run: npm run dist

      - name: Verify backend bundle
        shell: pwsh
        run: |
          $backendDir = 'standalone/dist/backend'
          if (-not (Test-Path $backendDir)) {
            throw "Backend staging directory missing: $backendDir"
          }

          $backendRoot = Join-Path $backendDir 'taiko-web-backend'
          if (-not (Test-Path $backendRoot)) {
            throw "Backend application directory missing: $backendRoot"
          }

          $backendExe = Join-Path $backendRoot 'taiko-web-backend.exe'
          if (-not (Test-Path $backendExe)) {
            throw "Backend executable missing: $backendExe"
          }

          $info = Get-Item $backendExe
          if (-not $info.Length -or $info.Length -le 0) {
            throw "Backend executable is empty: $backendExe"
          }

          $publicDir = Join-Path $backendRoot 'public'
          if (-not (Test-Path $publicDir)) { throw "Bundled public directory missing: $publicDir" }
          $songsDir = Join-Path $backendRoot 'songs'
          if (-not (Test-Path $songsDir)) { throw "Bundled songs directory missing: $songsDir" }

      - name: Verify staging artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rootPath = (Resolve-Path 'standalone/electron/dist/win-unpacked').Path
          if (-not (Test-Path $rootPath)) {
            throw "Missing win-unpacked directory at $rootPath"
          }

          $productName = '${{ steps.version.outputs.product }}'
          if (-not $productName) {
            throw 'productName metadata was not provided'
          }

          $expectedMain = Join-Path $rootPath "$productName.exe"
          if (-not (Test-Path $expectedMain)) {
            $fallback = Get-ChildItem -Path $rootPath -Filter '*.exe' | Select-Object -First 1
            if (-not $fallback) {
              throw "Unable to find any executable in $rootPath"
            }
            $expectedMain = $fallback.FullName
          }

          $pathsToCheck = @()
          $pathsToCheck += $expectedMain
          $pathsToCheck += (Join-Path $rootPath 'backend/taiko-web-backend/taiko-web-backend.exe')
          $pathsToCheck += (Join-Path $rootPath 'backend/taiko-web-backend/public')
          $pathsToCheck += (Join-Path $rootPath 'backend/taiko-web-backend/songs')
          $pathsToCheck += (Join-Path $rootPath 'assets/launcher/app.ico')
          $resourcesDir = Join-Path $rootPath 'resources'
          $pathsToCheck += $resourcesDir

          $missing = @()
          foreach ($item in $pathsToCheck) {
            if (-not (Test-Path $item)) {
              $missing += $item
            }
          }

          if (-not (Test-Path $resourcesDir)) {
            $missing += 'resources directory missing'
          } else {
            $resourcesPath = Join-Path $resourcesDir 'app'
            $resourcesArchive = Join-Path $resourcesDir 'app.asar'
            if (-not (Test-Path $resourcesPath) -and -not (Test-Path $resourcesArchive)) {
              $missing += 'resources/app or resources/app.asar'
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing build artifact(s): $($missing -join ', ')"
          }

          Get-ChildItem -Path $rootPath -Recurse | Select-Object FullName, Length | Out-String | Write-Host

      - name: Capture electron-builder effective config
        shell: pwsh
        run: |
          $configPath = 'standalone/electron/dist/builder-effective-config.yaml'
          if (Test-Path $configPath) {
            Get-Content $configPath | Out-String | Write-Host
          } else {
            Write-Warning "builder-effective-config.yaml not found at $configPath"
          }
      - name: Ensure Inno Setup & resolve ISCC.exe
        id: innosetup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 1) Если уже установлен — не трогаем. Иначе ставим/обновляем.
          $exists = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $exists -and -not $env:ISCC_PATH) {
            choco upgrade innosetup -y --no-progress
          }

          # 0) Надёжно резолвим путь к ISCC
          $iscc = $env:ISCC_PATH
          if (-not $iscc) {
            # fallback: попробуем найти в PATH
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }

            if (-not $iscc) {
              $candidates = @()
              $pf = $env:ProgramFiles
              if ($pf) { $candidates += Join-Path $pf 'Inno Setup 6\ISCC.exe' }
              $pf86 = ${env:ProgramFiles(x86)}
              if ($pf86) { $candidates += Join-Path $pf86 'Inno Setup 6\ISCC.exe' }
              $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          }

          # нормализуем строку (снимем кавычки и пробелы/CRLF)
          if ($iscc) { $iscc = $iscc.Trim(" `t`r`n'`"") }

          # финальная проверка
          if (-not $iscc -or -not (Test-Path $iscc)) {
            throw "ISCC_PATH is invalid or empty. Got: '$($env:ISCC_PATH)'; resolved: '$iscc'"
          }

          Write-Host "Using ISCC: $iscc"
          $env:ISCC_PATH = $iscc
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "isccPath=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          TAIKO_DESKTOP_VERSION: ${{ steps.version.outputs.value }}
          DESKTOP_STAGING_DIR: ${{ github.workspace }}\standalone\electron\dist\win-unpacked
          TAIKO_INSTALLER_OUTPUT: ${{ github.workspace }}\standalone\electron\dist\installer
          ISCC_PATH: ${{ steps.innosetup.outputs.isccPath }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Подготовим выходную директорию заранее, чтобы Resolve-Path сработал
          $outDirRaw = $env:TAIKO_INSTALLER_OUTPUT
          if ([string]::IsNullOrWhiteSpace($outDirRaw)) { throw 'TAIKO_INSTALLER_OUTPUT is not set' }
          if (Test-Path $outDirRaw) {
            Remove-Item $outDirRaw -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $outDirRaw | Out-Null

          # 0) Надёжно резолвим путь к ISCC
          $iscc = $env:ISCC_PATH
          if (-not $iscc) {
            # fallback: попробуем найти в PATH
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }

          # нормализуем строку (снимем кавычки и пробелы/CRLF)
          if ($iscc) { $iscc = $iscc.Trim(" `t`r`n'`"") }

          # финальная проверка
          if (-not $iscc -or -not (Test-Path $iscc)) {
            throw "ISCC_PATH is invalid or empty. Got: '$($env:ISCC_PATH)'; resolved: '$iscc'"
          }

          Write-Host "Using ISCC: $iscc"

          # 1) Подготовим параметры
          $version = $env:TAIKO_DESKTOP_VERSION
          $stage   = (Resolve-Path $env:DESKTOP_STAGING_DIR).Path
          $outDir  = (Resolve-Path $env:TAIKO_INSTALLER_OUTPUT).Path
          $iss     = (Resolve-Path 'packaging/windows/taiko-desktop.iss').Path

          # sanity-check инпутов
          @($stage, $outDir, $iss) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Path not found: $_" }
          }

          # 2) Вызов ISCC — строго в кавычках
          & "$iscc" `
            "/DMyVersion=$version" `
            "/DMyDistDir=$stage" `
            "/DMyOutputDir=$outDir" `
            "$iss"

          if ($LASTEXITCODE -ne 0) { throw "ISCC compilation failed with exit code $LASTEXITCODE" }

      - name: Collect installer artifact
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'standalone/electron/dist/installer' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer executable was not produced'
          }
          if (-not $installer.Length -or $installer.Length -le 0) {
            throw "Installer file is empty: $($installer.FullName)"
          }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: taiko-web-desktop-windows
          path: ${{ steps.installer.outputs.path }}

  build-linux:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build backend (PyInstaller onedir)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pyinstaller-hooks-contrib
          python standalone/packaging/build_backend.py

      - name: Verify backend files
        run: |
          set -euo pipefail
          echo "== dist tree =="
          ls -laR standalone/dist || true
          LINUX_BIN="standalone/dist/backend/taiko-web-backend/taiko-web-backend"
          WIN_BIN="standalone/dist/backend/taiko-web-backend/taiko-web-backend.exe"
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            if [[ ! -f "${LINUX_BIN}" ]]; then
              echo "Missing ${LINUX_BIN}" >&2
              exit 1
            fi
            chmod +x "${LINUX_BIN}"
          else
            if [[ ! -f "${WIN_BIN}" ]]; then
              echo "Missing ${WIN_BIN}" >&2
              exit 1
            fi
          fi

      - name: Show backend app_dir content
        if: always()
        run: |
          set -euo pipefail
          echo "== app dir =="
          ls -la "standalone/dist/backend/taiko-web-backend" || true

      - name: Clean packaged songs directory
        run: |
          rm -rf standalone/dist/backend/taiko-web-backend/songs/*

      - name: Smoke backend (empty library)
        run: |
          TAIKO_SMOKE_COPY_TRACK=0 bash scripts/smoke_run_linux.sh

      - name: Smoke backend with injected song
        run: |
          bash scripts/smoke_run_linux.sh

  release:
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      (github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: taiko-web-desktop-windows
          path: release

      - name: Prepare release payload
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Expected installer artifact" >&2
            exit 1
          fi
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md is missing" >&2
            exit 1
          fi
          cp RELEASE_NOTES.md release/RELEASE_NOTES.md
          echo "Release payload contents:"
          ls -al release

      - name: Generate tag and name
        id: gen
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.tag_name }}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
              NAME="${{ github.ref_name }}"
            else
              TAG="nightly-$(date +'%Y%m%d-%H%M')"
              NAME="nightly-$(date +'%Y%m%d')"
            fi
          else
            TAG="${{ github.event.inputs.tag_name }}"
            NAME="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "${{ github.event.inputs.draft }}" ]; then
            DRAFT="false"
          else
            DRAFT="${{ github.event.inputs.draft }}"
          fi
          if [ -z "${{ github.event.inputs.prerelease }}" ]; then
            PRERELEASE="true"
          else
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          fi
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gen.outputs.tag }}
          name: ${{ steps.gen.outputs.name }}
          draft: ${{ steps.gen.outputs.draft }}
          prerelease: ${{ steps.gen.outputs.prerelease }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.exe
            release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

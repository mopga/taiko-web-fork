name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. nightly-20251027-2130)"
        required: false
      prerelease:
        description: "Mark as prerelease?"
        type: boolean
        default: true
      draft:
        description: "Create as draft instead of published?"
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    outputs:
      installer-name: ${{ steps.installer.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate desktop prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $backendScript = 'standalone/packaging/build_backend.py'
          if (-not (Test-Path $backendScript)) {
            throw "Missing backend build script at $backendScript"
          }

          $builderConfig = 'standalone/electron/electron-builder.yml'
          if (-not (Test-Path $builderConfig)) {
            throw "Missing electron-builder configuration at $builderConfig"
          }

          function Get-IndentedValue {
            param(
              [string[]]$Lines,
              [string]$SectionName,
              [string]$KeyName
            )

            for ($i = 0; $i -lt $Lines.Count; $i++) {
              $line = $Lines[$i]
              $trimmed = $line.Trim()
              if (-not $trimmed -or $trimmed.StartsWith('#')) {
                continue
              }

              $indent = $line.Length - $line.TrimStart().Length
              if ($trimmed -eq "$SectionName:") {
                $sectionIndent = $indent
                for ($j = $i + 1; $j -lt $Lines.Count; $j++) {
                  $inner = $Lines[$j]
                  $innerTrim = $inner.Trim()
                  if (-not $innerTrim -or $innerTrim.StartsWith('#')) {
                    continue
                  }
                  $innerIndent = $inner.Length - $inner.TrimStart().Length
                  if ($innerIndent -le $sectionIndent) {
                    break
                  }
                  if ($innerTrim -match "^$KeyName:\s*(.+)$") {
                    $value = $Matches[1].Trim()
                    return $value.Trim('\"\'')
                  }
                }
              }
            }
            return $null
          }

          $builderLines = Get-Content $builderConfig
          $winIcon = Get-IndentedValue -Lines $builderLines -SectionName 'win' -KeyName 'icon'
          if (-not $winIcon) {
            throw 'electron-builder configuration must define win.icon'
          }

          $iconPath = Join-Path 'standalone/electron' $winIcon
          if (-not (Test-Path $iconPath)) {
            throw "Missing Windows icon referenced by electron-builder: $iconPath"
          }

          $buildResources = Get-IndentedValue -Lines $builderLines -SectionName 'directories' -KeyName 'buildResources'
          if ($buildResources) {
            $resources = Join-Path 'standalone/electron' $buildResources
            if (-not (Test-Path $resources)) {
              throw "Missing buildResources directory referenced by electron-builder: $resources"
            }
          }

      - name: Validate launcher icon
        shell: pwsh
        run: |
          if (-not (Test-Path 'assets\launcher\app.ico')) {
            throw 'Missing required icon at assets\launcher\app.ico'
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: standalone/electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Install Electron dependencies
        working-directory: standalone/electron
        run: npm install

      - name: Determine desktop metadata
        id: version
        shell: pwsh
        run: |
          $package = Get-Content 'standalone/electron/package.json' | ConvertFrom-Json
          if (-not $package.version) {
            throw 'Unable to read package version from standalone/electron/package.json'
          }
          if (-not $package.productName) {
            throw 'Unable to read productName from standalone/electron/package.json'
          }
          "value=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "product=$($package.productName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build desktop bundle
        working-directory: ./standalone/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
        run: npm run dist

      - name: Verify backend bundle
        shell: pwsh
        run: |
          $backendDir = 'standalone/dist/backend'
          if (-not (Test-Path $backendDir)) {
            throw "Backend staging directory missing: $backendDir"
          }

          $backendExe = Join-Path $backendDir 'taiko-web-backend.exe'
          if (-not (Test-Path $backendExe)) {
            throw "Backend executable missing: $backendExe"
          }

          $info = Get-Item $backendExe
          if (-not $info.Length -or $info.Length -le 0) {
            throw "Backend executable is empty: $backendExe"
          }

      - name: Verify staging artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rootPath = (Resolve-Path 'standalone/electron/dist/win-unpacked').Path
          if (-not (Test-Path $rootPath)) {
            throw "Missing win-unpacked directory at $rootPath"
          }

          $productName = '${{ steps.version.outputs.product }}'
          if (-not $productName) {
            throw 'productName metadata was not provided'
          }

          $expectedMain = Join-Path $rootPath "$productName.exe"
          if (-not (Test-Path $expectedMain)) {
            $fallback = Get-ChildItem -Path $rootPath -Filter '*.exe' | Select-Object -First 1
            if (-not $fallback) {
              throw "Unable to find any executable in $rootPath"
            }
            $expectedMain = $fallback.FullName
          }

          $pathsToCheck = @()
          $pathsToCheck += $expectedMain
          $pathsToCheck += (Join-Path $rootPath 'backend/taiko-web-backend.exe')
          $pathsToCheck += (Join-Path $rootPath 'assets/launcher/app.ico')
          $resourcesDir = Join-Path $rootPath 'resources'
          $pathsToCheck += $resourcesDir

          $missing = @()
          foreach ($item in $pathsToCheck) {
            if (-not (Test-Path $item)) {
              $missing += $item
            }
          }

          if (-not (Test-Path $resourcesDir)) {
            $missing += 'resources directory missing'
          } else {
            $resourcesPath = Join-Path $resourcesDir 'app'
            $resourcesArchive = Join-Path $resourcesDir 'app.asar'
            if (-not (Test-Path $resourcesPath) -and -not (Test-Path $resourcesArchive)) {
              $missing += 'resources/app or resources/app.asar'
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing build artifact(s): $($missing -join ', ')"
          }

          Get-ChildItem -Path $rootPath -Recurse | Select-Object FullName, Length | Out-String | Write-Host

      - name: Capture electron-builder effective config
        shell: pwsh
        run: |
          $configPath = 'standalone/electron/dist/builder-effective-config.yaml'
          if (Test-Path $configPath) {
            Get-Content $configPath | Out-String | Write-Host
          } else {
            Write-Warning "builder-effective-config.yaml not found at $configPath"
          }

      - name: Install Inno Setup 6
        id: innosetup
        shell: pwsh
        run: |
          choco install innosetup --version=6.2.2 -y --no-progress
          $isccPath = "$Env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            throw "ISCC.exe not found at $isccPath"
          }
          "iscc=$isccPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        env:
          TAIKO_DESKTOP_VERSION: ${{ steps.version.outputs.value }}
          DESKTOP_STAGING_DIR: ${{ github.workspace }}\standalone\electron\dist\win-unpacked
          TAIKO_INSTALLER_OUTPUT: ${{ github.workspace }}\standalone\electron\dist\installer
          ISCC_PATH: ${{ steps.innosetup.outputs.iscc }}
        run: |
          $outDir = '${{ github.workspace }}\standalone\electron\dist\installer'
          if (Test-Path $outDir) {
            Remove-Item $outDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & $env:ISCC_PATH 'packaging\windows\taiko-desktop.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC compilation failed with exit code $LASTEXITCODE"
          }

      - name: Collect installer artifact
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'standalone/electron/dist/installer' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer executable was not produced'
          }
          if (-not $installer.Length -or $installer.Length -le 0) {
            throw "Installer file is empty: $($installer.FullName)"
          }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: taiko-web-desktop-windows
          path: ${{ steps.installer.outputs.path }}

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      (github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: taiko-web-desktop-windows
          path: release

      - name: Prepare release payload
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Expected installer artifact" >&2
            exit 1
          fi
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md is missing" >&2
            exit 1
          fi
          cp RELEASE_NOTES.md release/RELEASE_NOTES.md
          echo "Release payload contents:"
          ls -al release

      - name: Generate tag and name
        id: gen
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.tag_name }}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
              NAME="${{ github.ref_name }}"
            else
              TAG="nightly-$(date +'%Y%m%d-%H%M')"
              NAME="nightly-$(date +'%Y%m%d')"
            fi
          else
            TAG="${{ github.event.inputs.tag_name }}"
            NAME="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "${{ github.event.inputs.draft }}" ]; then
            DRAFT="false"
          else
            DRAFT="${{ github.event.inputs.draft }}"
          fi
          if [ -z "${{ github.event.inputs.prerelease }}" ]; then
            PRERELEASE="true"
          else
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          fi
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gen.outputs.tag }}
          name: ${{ steps.gen.outputs.name }}
          draft: ${{ steps.gen.outputs.draft }}
          prerelease: ${{ steps.gen.outputs.prerelease }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.exe
            release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="utf-8">
        <title>Song Catalog</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <link rel="icon" href="{{config.assets_baseurl}}img/favicon.png" type="image/png">
        <link rel="stylesheet" href="src/css/catalog.css?{{version.commit_short}}">
</head>
<body>
        <div class="catalog-app">
                <div class="catalog-header">Song Catalog</div>
                <div class="catalog-scroll">
                        <div class="catalog-error"></div>
                        <div class="catalog-empty">No songs found.</div>
                        <div class="catalog-spacer catalog-spacer--top"></div>
                        <div class="catalog-items"></div>
                        <div class="catalog-spacer catalog-spacer--bottom"></div>
                        <div class="catalog-loading"><span>Loading…</span></div>
                </div>
        </div>
        <script src="src/js/ui/catalog-data-source.js?{{version.commit_short}}"></script>
        <script src="src/js/ui/catalog-view.js?{{version.commit_short}}"></script>
        <script src="src/js/ui/catalog-app.js?{{version.commit_short}}"></script>
</body>
</html>
